included:
  - HoyoFetch
  - Packages/SophonKit/Sources
  - Packages/SophonKit/Tests
  - Packages/SophonKit/Package.swift
excluded:
  - Packages/SophonKit/.build
  # Generated by protoc-gen-swift (Packages/SophonKit/Scripts/generate-protos.sh).
  - Packages/SophonKit/Sources/SophonKit/Proto

disabled_rules:
  # Trailing commas in multi-line literals are the house style (see hdiffswift) and legal everywhere since Swift 6.1.
  - trailing_comma

identifier_name:
  excluded:
    - i
    - n
    - id
    - fd
    - io
    - ok

nesting:
  # A CodingKeys enum inside a nested model type is idiomatic Codable, not a design smell.
  ignore_coding_keys: true
